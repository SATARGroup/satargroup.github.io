<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | SATAR Group</title>
    <link rel="stylesheet" href="style.css?v=bw1">
</head>
<body>

    <header>
    <div class="container nav-container">
        <!-- Brand Logo + Text -->
        <a href="index.html" class="brand">
            <img src="Slogo.png" alt="SATAR Group Logo" class="brand-logo">
            <span>SATAR Group</span>
        </a>

        
        <ul class="nav-links">
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="research.html">Research</a></li>
            <li><a href="publications.html">Publications</a></li>
            <li><a href="people.html">People</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </div>
</header>

    <main class="container">
        <section class="page-intro">
            <h1 class="page-title">Get in Touch</h1>
            <p class="lead-text">Inquiries regarding research positions, technical collaborations, or code access.</p>
        </section>

        <div class="contact-layout" style="margin-bottom: 4rem;">
            <div>
                <h3 style="font-family: 'Space Grotesk', sans-serif; margin-bottom: 1rem; color: #fff;">Lab Location</h3>
                <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
                    Anywhere we sit XD!!
                </p>
                <h3 style="font-family: 'Space Grotesk', sans-serif; margin-bottom: 0.5rem; color: #fff;">E-mail</h3>
                <p style="color: var(--text-muted);">satargroup@proton.me</p>
            </div>

            <form onsubmit="event.preventDefault(); alert('Message submitted.');">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" required placeholder="Your full name">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" required placeholder="your_mail@something.com">
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="4" required placeholder="Maybe a cup of coffee...."></textarea>
                </div>
                <button type="submit" class="btn">Send Inquiry</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="container"><p>&copy; 2026 SATAR Group.</p></div>
    </footer>

</body>
</html>
