<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | SATAR Group</title>
    <link rel="stylesheet" href="style.css?v=bw1">
</head>
<body>

    <header>
        <div class="container nav-container">
            <a href="index.html" class="brand"><span class="brand-dot"></span> SATAR GROUP</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="research.html">Research</a></li>
                <li><a href="publications.html">Publications</a></li>
                <li><a href="people.html">People</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </div>
    </header>

    <main class="container">
        <section class="page-intro">
            <h1 class="page-title">Get in Touch</h1>
            <p class="lead-text">Inquiries regarding graduate research positions, technical collaborations, or code access.</p>
        </section>

        <div class="contact-layout" style="margin-bottom: 4rem;">
            <div>
                <h3 style="font-family: 'Space Grotesk', sans-serif; margin-bottom: 1rem; color: #fff;">Lab Location</h3>
                <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
                    SATAR Research Group<br>
                    Anywhere we sit
                </p>
                <h3 style="font-family: 'Space Grotesk', sans-serif; margin-bottom: 0.5rem; color: #fff;">Email</h3>
                <p style="color: var(--text-muted);">satargroup@proton.me</p>
            </div>

            <form onsubmit="event.preventDefault(); alert('Message submitted.');">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" required placeholder="Your full name">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" required placeholder="academic@institution.edu">
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="4" required placeholder="Your research interest or inquiry..."></textarea>
                </div>
                <button type="submit" class="btn">Send Inquiry</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="container"><p>&copy; 2026 SATAR Group.</p></div>
    </footer>

</body>
</html>
