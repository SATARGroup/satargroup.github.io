<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | SATAR Group</title>
    <link rel="stylesheet" href="style.css?v=bw1">
</head>
<body>

<header>
    <div class="container nav-container">
        <a href="index.html" class="brand">
    <!-- Dark Mode Logo -->
    <img src="darklogo.png" alt="SATAR Group Logo" class="brand-logo logo-dark">
    <!-- Light Mode Logo -->
    <img src="lightlogo.png" alt="SATAR Group Logo" class="brand-logo logo-light">
    
    <span>SATAR Group</span>
</a>

        <!-- Mobile Menu Toggle Button -->
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">&#9776;</button>

       <ul class="nav-links" id="navMenu">
    <li><a href="index.html">Home</a></li>
    <li><a href="research.html">Research</a></li>
    <li><a href="publications.html">Publications</a></li>
    <li><a href="people.html">People</a></li>
    <li><a href="resource.html">Resources</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li><button class="theme-toggle-btn" id="themeBtn">☀ Light</button></li>
</ul>
    </div>
</header>

    <main class="container">
        <section class="page-intro">
            <h1 class="page-title">Get in Touch</h1>
            <p class="lead-text">Inquiries regarding research positions, technical collaborations, or code access.</p>
        </section>

        <div class="contact-layout" style="margin-bottom: 4rem;">
            <div>
                <h3 style="font-family: 'Space Grotesk', sans-serif; margin-bottom: 1rem; color: #fff;">Lab Location</h3>
                <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
                    Anywhere we sit XD!!
                </p>
                <h3 style="font-family: 'Space Grotesk', sans-serif; margin-bottom: 0.5rem; color: #fff;">E-mail</h3>
                <p style="color: var(--text-muted);">satargroup@proton.me</p>
            </div>

            <!-- Formspree Integration -->
            <form action="https://formspree.io/f/xjyvzzwz" method="POST">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="name" required placeholder="Your  Full  Name">
                </div>
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" name="email" required placeholder="yourmail@something.com">
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea name="message" rows="4" required placeholder="Maybe a cup of coffee...."></textarea>
                </div>
                <button type="submit" class="btn">Send Inquiry</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="container"><p>&copy; 2026 SATAR Group.</p></div>
    </footer>

<script>
    const menuBtn = document.getElementById('menuToggle');
    const navMenu = document.getElementById('navMenu');

    if(menuBtn && navMenu) {
        menuBtn.addEventListener('click', () => {
            navMenu.classList.toggle('active');
        });
    }
</script>
    <script src="theme.js"></script>
</body>
</html>
</body>
